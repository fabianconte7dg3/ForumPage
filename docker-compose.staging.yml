# Staging/producción — app + Postgres + Caddy. Separado a propósito del
# docker-compose.yml de solo-DB usado en desarrollo (ver CLAUDE.md).
# Uso: docker compose -f docker-compose.staging.yml --env-file .env up -d
#
# Pendiente (no cubierto acá, ver docs/plan.md): almacenamiento en buckets
# separados (medios públicos / documentos privados de becarios / respaldos)
# por el no-negociable de CLAUDE.md. Mientras tanto, `media_uploads` abajo es
# un volumen local de Docker — evita perder archivos entre despliegues, pero
# no reemplaza los buckets de DigitalOcean Spaces del runbook §4.4.
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_uploads:/app/media
      - documentos_privados_uploads:/app/documentos-privados
      - fotos_becarios_uploads:/app/fotos-becarios
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: forum
    volumes:
      - pgdata:/var/lib/postgresql/data
    # SIN puertos publicados — solo accesible dentro de la red de Docker
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  media_uploads:
  documentos_privados_uploads:
  fotos_becarios_uploads:
